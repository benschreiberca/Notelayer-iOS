<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notelayer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Auth screen -->
    <div id="auth-screen" class="screen hidden">
      <div class="header">
        <span class="logo">✅</span>
        <span class="app-name">Notelayer</span>
      </div>
      <div class="form-section">
        <p class="form-subtitle">Sign in to capture tasks</p>
        <input type="email" id="email-input" placeholder="Email" autocomplete="email" />
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
        <div id="auth-error" class="error-text hidden"></div>
        <button id="signin-btn" class="btn-primary">Sign In</button>
      </div>
    </div>

    <!-- Main screen -->
    <div id="main-screen" class="screen hidden">
      <div class="header">
        <div class="header-left">
          <span class="logo">✅</span>
          <span class="app-name">Notelayer</span>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="icon-btn" title="Refresh">↺</button>
          <button id="signout-btn" class="icon-btn" title="Sign out">⤻</button>
        </div>
      </div>

      <!-- Quick add -->
      <div class="quick-add">
        <input type="text" id="task-input" placeholder="Add a task…" maxlength="200" />
        <select id="priority-select">
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
          <option value="deferred">Deferred</option>
        </select>
        <button id="add-btn" class="btn-icon-primary" title="Add task">+</button>
      </div>

      <!-- Task list -->
      <div id="task-list" class="task-list"></div>

      <div class="footer">
        <span id="task-count" class="task-count"></span>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading-screen" class="screen">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
